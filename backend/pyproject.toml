[project]
name = "clipper"
version = "0.1.0"
description = "AI video clipper"
authors = [
    { name = "kagure-nyakio", email = "kagurenyakio@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "ffmpeg-python>=0.2.0",
    "openai>=3.14.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
]

[project.scripts]
clip = "clipper.cli:main"
clipper = "clipper.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[[tool.mypy.overrides]]
module = ["ffmpeg.*", "faster_whisper.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "ipython>=9.17.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
markers = [
    "slow: tests that load a real model or run real transcription",
]
pythonpath = ["."]
